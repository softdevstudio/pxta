name: Action test

# Runs the GitHub Action in this repo (action.yml) against a pxta built from
# this commit, on a local page that leaks an address before consent, and on
# saved findings with and without rules. The download job uses a published
# release instead; start it by hand after a release.
on:
  push:
    branches: [main]
    paths: [action.yml, .github/workflows/action-test.yml, "cmd/**", "*.go", "testdata/action/**"]
  pull_request:
    paths: [action.yml, .github/workflows/action-test.yml, "cmd/**", "*.go", "testdata/action/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag the download job pins (vX.Y.Z); empty means the latest release
        required: false
        default: ""

permissions:
  contents: read

jobs:
  local:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build pxta
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          go build -o "$RUNNER_TEMP/pxta$ext" ./cmd/pxta
          echo "PXTA_BIN=$RUNNER_TEMP/pxta$ext" >> "$GITHUB_ENV"

      # Saved findings: no browser needed, so every OS runs these.
      - name: Saved findings break the default rules
        id: saved
        uses: ./
        with:
          findings: testdata/action/findings-bad.json
          fail: "false"
          pxta-path: ${{ env.PXTA_BIN }}
      - name: Saved findings pass with an allow entry
        id: allowed
        uses: ./
        with:
          findings: testdata/action/findings-bad.json
          rules: testdata/action/rules-allow.json
          pxta-path: ${{ env.PXTA_BIN }}
      - name: A baseline comparison reports the new finding
        id: diffreport
        uses: ./
        with:
          findings: testdata/action/findings-bad.json
          baseline: testdata/action/findings-baseline.json
          fail: "false"
          pxta-path: ${{ env.PXTA_BIN }}
      - name: Against itself, no change
        id: diffsame
        uses: ./
        with:
          findings: testdata/action/findings-bad.json
          baseline: testdata/action/findings-bad.json
          fail: "false"
          pxta-path: ${{ env.PXTA_BIN }}
      - name: With baseline-fail-on, a new medium finding fails even when the rules allow it
        id: difffail
        continue-on-error: true
        uses: ./
        with:
          findings: testdata/action/findings-bad.json
          rules: testdata/action/rules-allow.json
          baseline: testdata/action/findings-baseline.json
          baseline-fail-on: medium
          pxta-path: ${{ env.PXTA_BIN }}
      - name: With baseline-fail-on high, the same comparison passes
        id: diffhigh
        uses: ./
        with:
          findings: testdata/action/findings-bad.json
          rules: testdata/action/rules-allow.json
          baseline: testdata/action/findings-baseline.json
          baseline-fail-on: high
          pxta-path: ${{ env.PXTA_BIN }}
      - name: Check the saved-findings results
        shell: bash
        run: |
          [ "${{ steps.diffreport.outputs.diff-exit-code }}" = 0 ] && [ "${{ steps.diffreport.outputs.changes }}" = true ] || { echo "::error::diff report: exit ${{ steps.diffreport.outputs.diff-exit-code }} changes ${{ steps.diffreport.outputs.changes }}"; exit 1; }
          [ "${{ steps.diffsame.outputs.changes }}" = false ] || { echo "::error::diff against itself: changes ${{ steps.diffsame.outputs.changes }}"; exit 1; }
          [ "${{ steps.difffail.outcome }}" = failure ] && [ "${{ steps.difffail.outputs.diff-exit-code }}" = 1 ] || { echo "::error::baseline-fail-on medium: ${{ steps.difffail.outcome }} ${{ steps.difffail.outputs.diff-exit-code }}"; exit 1; }
          [ "${{ steps.diffhigh.outputs.diff-exit-code }}" = 0 ] && [ "${{ steps.diffhigh.outputs.result }}" = pass ] || { echo "::error::baseline-fail-on high: ${{ steps.diffhigh.outputs.diff-exit-code }}"; exit 1; }
          [ "${{ steps.saved.outputs.result }}" = fail ] && [ "${{ steps.saved.outputs.exit-code }}" = 1 ] || { echo "::error::saved: ${{ steps.saved.outputs.result }} ${{ steps.saved.outputs.exit-code }}"; exit 1; }
          [ "${{ steps.allowed.outputs.result }}" = pass ] || { echo "::error::allowed: ${{ steps.allowed.outputs.result }}"; exit 1; }

      # A real audit in the runner's Chrome (Linux and macOS runners have it).
      - name: Serve the test pages
        if: runner.os != 'Windows'
        shell: bash
        run: |
          (cd testdata/smoke && python3 -m http.server 8123 --bind 127.0.0.1 >/dev/null 2>&1 &)
          (cd testdata/action/tracked && python3 -m http.server 8125 --bind 127.0.0.1 >/dev/null 2>&1 &)
          (mkdir -p "$RUNNER_TEMP/sink" && cd "$RUNNER_TEMP/sink" && python3 -m http.server 8124 >/dev/null 2>&1 &)
          sleep 2
      - name: A clean page passes
        if: runner.os != 'Windows'
        id: clean
        uses: ./
        with:
          url: http://127.0.0.1:8123/
          pages: "1"
          out: clean-report
          artifact-name: clean-report-${{ matrix.os }}
          args: --idle 1s --delay 0
          pxta-path: ${{ env.PXTA_BIN }}
      - name: A page that leaks an address fails, and the report is redacted
        if: runner.os != 'Windows'
        id: leak
        uses: ./
        with:
          url: http://127.0.0.1:8125/
          pages: "1"
          out: leak-report
          artifact-name: leak-report-${{ matrix.os }}
          args: --idle 1s --delay 0
          fail: "false"
          pxta-path: ${{ env.PXTA_BIN }}
      - name: Check the audit results
        if: runner.os != 'Windows'
        shell: bash
        run: |
          [ "${{ steps.clean.outputs.result }}" = pass ] || { echo "::error::clean page: ${{ steps.clean.outputs.result }} ${{ steps.clean.outputs.exit-code }}"; exit 1; }
          [ "${{ steps.leak.outputs.exit-code }}" = 1 ] || { echo "::error::leaking page: exit ${{ steps.leak.outputs.exit-code }}"; exit 1; }
          grep -q '"code": "personal-data"' leak-report/check.json || { echo "::error::no personal-data problem in check.json"; exit 1; }
          if grep -rl "someone@example.org\|someone%40example.org" leak-report; then echo "::error::the redacted report still holds the address"; exit 1; fi
          grep -q REDACTED leak-report/requests.har || { echo "::error::no REDACTED marker in requests.har"; exit 1; }

  download:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Which release
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          tag="$IN_TAG"
          [ -n "$tag" ] || tag=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: The latest release judges saved findings
        id: rel
        uses: ./
        with:
          findings: testdata/action/findings-bad.json
          fail: "false"
      - name: A pinned release judges saved findings
        id: pin
        uses: ./
        with:
          findings: testdata/action/findings-bad.json
          fail: "false"
          version: ${{ steps.tag.outputs.tag }}
      - name: Check the outputs and the pinned binary's version
        shell: bash
        env:
          REL: ${{ steps.rel.outputs.exit-code }}
          REL_V: ${{ steps.rel.outputs.version }}
          PIN: ${{ steps.pin.outputs.exit-code }}
          PIN_V: ${{ steps.pin.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          [ "$REL" = 1 ] || { echo "::error::latest pxta: exit $REL"; exit 1; }
          [ "$REL_V" = latest ] || { echo "::error::an unpinned local action ran $REL_V, not latest"; exit 1; }
          [ "$PIN" = 1 ] || { echo "::error::pinned pxta: exit $PIN"; exit 1; }
          [ "$PIN_V" = "$TAG" ] || { echo "::error::asked for $TAG, ran $PIN_V"; exit 1; }
          got=$("$RUNNER_TEMP/pxta-bin/pxta" version)
          case "$got" in *"${TAG#v}"*) ;; *) echo "::error::pinned binary says $got, want ${TAG#v}"; exit 1 ;; esac
