name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-version.sh

  # Unit tests everywhere, and the browser tests against the Chrome that the
  # GitHub runners come with. PXTA_REQUIRE_BROWSER turns "no browser found"
  # into a failure instead of a skip.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PXTA_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::not gofmt-formatted: $out"; exit 1; fi
      - run: go vet ./...
      - name: Tests
        run: |
          set -o pipefail
          go test -count=1 -race -timeout 40m ./... 2>&1 | tee test.log || {
            grep -E -- "--- FAIL|panic:|_test.go:[0-9]+:|Error Trace|browser" test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: test.log

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Unit tests and one browser audit
        shell: bash
        env:
          PXTA_REQUIRE_BROWSER: "1"
        run: |
          set -o pipefail
          go test -count=1 -timeout 30m -run 'Test(Catalog|Match|Email|Other|Sensitive|Consent|Robots|Normalize|Analyze|Render|CDP|Dial|CLI|BrowserShop)' ./... 2>&1 | tee test.log || {
            grep -E -- "--- FAIL|panic:|_test.go:[0-9]+:" test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
