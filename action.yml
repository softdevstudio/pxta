name: PXTA check
description: Audit a site's tracking pixels and fail the job when a tag fires before consent or personal data goes out.
author: SoftDevStudio.com
branding:
  icon: shield
  color: orange

inputs:
  url:
    description: Address to audit. Leave empty and set `findings` to judge an earlier audit.
    required: false
    default: ""
  findings:
    description: Path to a findings.json from an earlier audit, judged instead of running one.
    required: false
    default: ""
  rules:
    description: Path to a rules file (JSON). Empty uses the defaults (fail on medium and above).
    required: false
    default: ""
  pages:
    description: Most pages to visit.
    required: false
    default: "20"
  passes:
    description: Consent passes to run.
    required: false
    default: "none,reject,accept"
  redact:
    description: Replace personal values in the report with REDACTED (recommended when the report is uploaded).
    required: false
    default: "true"
  args:
    description: More `pxta check` options, as one string (for example `--ignore-robots --depth 2`).
    required: false
    default: ""
  out:
    description: Folder for the report.
    required: false
    default: pxta-report
  upload:
    description: Upload the report folder as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: pxta-report
  fail:
    description: Fail the step when a rule is broken. Set to false to report only.
    required: false
    default: "true"
  version:
    description: "PXTA release to use, a tag such as v0.2.0, or latest. Empty means the release this action is pinned to (softdevstudio/pxta@v0.2.0 runs pxta 0.2.0), else the latest."
    required: false
    default: ""
  baseline:
    description: An earlier findings.json to compare this audit with (pxta diff). The changes go to the job summary.
    required: false
    default: ""
  baseline-fail-on:
    description: "Let the comparison decide the step: fail on a new finding at this severity or above (high, medium, low, info), on a lost consent pass or a banner that's gone, or with any on any change. Problems the baseline already has then don't fail it. Empty: the comparison only reports."
    required: false
    default: ""
  pxta-path:
    description: Use this pxta binary instead of downloading one (for testing the action itself).
    required: false
    default: ""

outputs:
  result:
    description: pass or fail
    value: ${{ steps.check.outputs.result }}
  exit-code:
    description: pxta check's exit code (0 pass, 1 rule broken, 2 usage or rules error, 3 audit failed)
    value: ${{ steps.check.outputs.exit-code }}
  version:
    description: The pxta release the action ran (a vX.Y.Z tag, latest, or local)
    value: ${{ steps.install.outputs.version }}
  diff-exit-code:
    description: pxta diff's exit code when a baseline was given (0 no change, 1 changes or a new finding at baseline-fail-on, 2 or 3 an error)
    value: ${{ steps.diff.outputs.exit-code }}
  changes:
    description: true when the comparison with the baseline found a change
    value: ${{ steps.diff.outputs.changes }}
  report:
    description: Folder holding report.html, findings.json, requests.har and check.json
    value: ${{ inputs.out }}

runs:
  using: composite
  steps:
    - name: Install pxta
      id: install
      shell: bash
      env:
        PXTA_VERSION: ${{ inputs.version }}
        PXTA_PATH: ${{ inputs.pxta-path }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        # github.action_ref is empty in some runners; the env variable is the fallback.
        ACTION_REF="${ACTION_REF:-${GITHUB_ACTION_REF:-}}"
        if [ -z "$PXTA_VERSION" ]; then
          if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then PXTA_VERSION="$ACTION_REF"; else PXTA_VERSION=latest; fi
        fi
        if [ -n "$PXTA_PATH" ]; then
          echo "bin=$PXTA_PATH" >> "$GITHUB_OUTPUT"
          echo "version=local" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        case "$RUNNER_OS" in
          Linux) os=linux ;; macOS) os=darwin ;; Windows) os=windows ;;
          *) echo "::error::pxta has no build for $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;; ARM64) arch=arm64 ;;
          *) echo "::error::pxta has no build for $RUNNER_ARCH"; exit 1 ;;
        esac
        if [ "$os" = windows ] && [ "$arch" != amd64 ]; then echo "::error::pxta has no Windows $arch build"; exit 1; fi
        ext=tar.gz; [ "$os" = windows ] && ext=zip
        name="pxta_${os}_${arch}.${ext}"
        if [ "$PXTA_VERSION" = latest ]; then
          base="https://github.com/softdevstudio/pxta/releases/latest/download"
        else
          base="https://github.com/softdevstudio/pxta/releases/download/${PXTA_VERSION}"
        fi
        dir="$RUNNER_TEMP/pxta-bin"
        mkdir -p "$dir"
        cd "$dir"
        curl -fsSL --retry 3 -o "$name" "$base/$name" || { echo "::error::could not download $base/$name"; exit 1; }
        curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS" || { echo "::error::could not download SHA256SUMS"; exit 1; }
        want=$(awk -v n="$name" '$2==n || $2=="*"n {print $1}' SHA256SUMS)
        if command -v sha256sum >/dev/null; then got=$(sha256sum "$name" | cut -d' ' -f1); else got=$(shasum -a 256 "$name" | cut -d' ' -f1); fi
        if [ -z "$want" ] || [ "$want" != "$got" ]; then echo "::error::$name does not match SHA256SUMS"; exit 1; fi
        if [ "$ext" = zip ]; then unzip -oq "$name"; bin="$dir/pxta.exe"; else tar -xzf "$name"; bin="$dir/pxta"; fi
        "$bin" version
        echo "bin=$bin" >> "$GITHUB_OUTPUT"
        echo "version=$PXTA_VERSION" >> "$GITHUB_OUTPUT"

    - name: Run pxta check
      id: check
      shell: bash
      env:
        PXTA_BIN: ${{ steps.install.outputs.bin }}
        IN_URL: ${{ inputs.url }}
        IN_FINDINGS: ${{ inputs.findings }}
        IN_RULES: ${{ inputs.rules }}
        IN_PAGES: ${{ inputs.pages }}
        IN_PASSES: ${{ inputs.passes }}
        IN_REDACT: ${{ inputs.redact }}
        IN_ARGS: ${{ inputs.args }}
        IN_OUT: ${{ inputs.out }}
      run: |
        # The runner starts bash with -e; pxta exiting 1 must not end the step
        # before the exit code is recorded.
        set +e -uf
        args=(check)
        if [ -n "$IN_FINDINGS" ]; then
          args+=(--findings "$IN_FINDINGS")
        else
          args+=("$IN_URL" --out "$IN_OUT" --pages "$IN_PAGES" --passes "$IN_PASSES" --quiet)
          if [ "$IN_REDACT" = true ]; then args+=(--redact); fi
        fi
        if [ -n "$IN_RULES" ]; then args+=(--rules "$IN_RULES"); fi
        args+=(--format github)
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then args+=(--summary "$GITHUB_STEP_SUMMARY"); fi
        # IN_ARGS is split on spaces on purpose: it is a list of options.
        # set -f above keeps a * in it from being expanded as a file pattern.
        # shellcheck disable=SC2206
        if [ -n "$IN_ARGS" ]; then args+=($IN_ARGS); fi
        "$PXTA_BIN" "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ $code = 0 ]; then echo "result=pass" >> "$GITHUB_OUTPUT"; else echo "result=fail" >> "$GITHUB_OUTPUT"; fi
        exit 0

    - name: Compare with the baseline
      id: diff
      if: ${{ inputs.baseline != '' && (steps.check.outputs.exit-code == '0' || steps.check.outputs.exit-code == '1') }}
      shell: bash
      env:
        PXTA_BIN: ${{ steps.install.outputs.bin }}
        IN_BASELINE: ${{ inputs.baseline }}
        IN_FAIL_ON: ${{ inputs.baseline-fail-on }}
        IN_FINDINGS: ${{ inputs.findings }}
        IN_OUT: ${{ inputs.out }}
      run: |
        set +e -uf
        cur="$IN_FINDINGS"
        [ -n "$cur" ] || cur="$IN_OUT/findings.json"
        # Report-only unless baseline-fail-on is set; "any" means any change.
        fail_on=never
        case "$IN_FAIL_ON" in
          "") fail_on=never ;;
          any) fail_on="" ;;
          *) fail_on="$IN_FAIL_ON" ;;
        esac
        args=(diff "$IN_BASELINE" "$cur" --format github)
        if [ -n "$fail_on" ]; then args+=(--fail-on "$fail_on"); fi
        if [ -z "$IN_FINDINGS" ]; then args+=(--out "$IN_OUT/diff.json"); fi
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then args+=(--summary "$GITHUB_STEP_SUMMARY"); fi
        "$PXTA_BIN" "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        # Whether anything changed, whatever the threshold.
        "$PXTA_BIN" diff "$IN_BASELINE" "$cur" > /dev/null 2>&1
        if [ $? = 1 ]; then echo "changes=true" >> "$GITHUB_OUTPUT"; else echo "changes=false" >> "$GITHUB_OUTPUT"; fi
        exit 0

    - name: Upload the report
      # Only the report files, and only from a finished check: never the
      # working files an interrupted audit leaves behind.
      if: ${{ always() && inputs.upload == 'true' && inputs.findings == '' && (steps.check.outputs.exit-code == '0' || steps.check.outputs.exit-code == '1') }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.out }}/report.html
          ${{ inputs.out }}/findings.json
          ${{ inputs.out }}/requests.har
          ${{ inputs.out }}/check.json
          ${{ inputs.out }}/diff.json
        if-no-files-found: ignore

    - name: Verdict
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.exit-code }}
        FAIL: ${{ inputs.fail }}
        DIFF: ${{ steps.diff.outputs.exit-code }}
        DIFF_FAIL_ON: ${{ inputs.baseline-fail-on }}
      run: |
        case "$DIFF" in
          ""|0) ;;
          1) if [ -n "$DIFF_FAIL_ON" ] && [ "$FAIL" = true ]; then echo "::error::pxta diff: new since the baseline, see the annotations and the job summary"; diff_failed=1; fi ;;
          *) echo "::error::pxta diff could not compare with the baseline (exit $DIFF)"; exit "$DIFF" ;;
        esac
        # With baseline-fail-on, the comparison decides: problems the
        # baseline already has are known and don't fail the step.
        if [ -n "$DIFF_FAIL_ON" ] && [ -n "$DIFF" ]; then
          case "$CODE" in
            0|1) [ "$CODE" = 1 ] && echo "pxta check found problems; the baseline comparison decides the step"
                 [ -z "${diff_failed:-}" ] || exit 1
                 exit 0 ;;
          esac
        fi
        case "$CODE" in
          0) echo "pxta check passed"; [ -z "${diff_failed:-}" ] || exit 1 ;;
          1) if [ "$FAIL" = true ]; then echo "::error::pxta check: rules broken, see the annotations and the job summary"; exit 1; fi
             echo "pxta check found problems (fail: false, so the step passes)" ;;
          *) echo "::error::pxta check could not finish (exit $CODE)"; exit "${CODE:-2}" ;;
        esac
