<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encodings test</title><style>body{font:16px/1.5 Georgia,serif;max-width:760px;margin:0 auto;padding:20px;color:#222}nav a{margin-right:14px}footer{margin-top:40px;color:#777;font-size:13px}</style>
<script>
(async function () {
  const C = 'https://collector.datasink.test/c';
  const img = (q) => { new Image().src = C + '?' + q; };
  img('kind=plain&e=plain@encodings.test');
  img('kind=urlenc&e=' + encodeURIComponent('urlenc@encodings.test'));
  img('kind=double&e=' + encodeURIComponent(encodeURIComponent('double@encodings.test')));
  img('kind=base64&e=' + encodeURIComponent(btoa('base64@encodings.test')));
  img('kind=pageaddr&dl=' + encodeURIComponent('https://www.encodings.test/thanks?email=pageaddr%40encodings.test'));
  fetch(C, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'json', user: { contact: 'json@encodings.test' } }) });
  fetch(C, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'kind=jsonfield&data=' + encodeURIComponent(JSON.stringify({ a: [{ b: 'jsonfield@encodings.test' }] })) });
  fetch(C, { method: 'POST', mode: 'no-cors', body: 'kind=lines\nen=sign_up&ep.mail=' + encodeURIComponent('lines@encodings.test') });
  navigator.sendBeacon(C + '?kind=beacon&a=1&b=2', JSON.stringify({ kind: 'beacon', who: 'beacon@encodings.test' }));
  const h = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('hashed@encodings.test')))).map((x) => x.toString(16).padStart(2, '0')).join('');
  img('kind=hash&h=' + h);
})();
</script>
</head><body>
<header><strong>Encodings test</strong><nav></nav></header>
<main><h1>Encodings</h1><p>Contact hashed@encodings.test for help.</p></main>
<footer>Encodings test is a fictional business made for PXTA's tests.</footer>
</body></html>
